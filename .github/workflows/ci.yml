name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package, Product Contract, Documentation, and Demo
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_MAJOR: '26'
      SIMULATOR_DEVICE: iPhone 17
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve stable Xcode
        run: |
          ruby <<'RUBY'
          major = ENV.fetch("XCODE_MAJOR")
          candidates = Dir["/Applications/Xcode*.app"].select { |candidate| File.directory?(candidate) }
          candidates.select! do |candidate|
            File.basename(candidate).match?(/Xcode_#{Regexp.escape(major)}(?:[_.-]|\z)/)
          end
          candidates.reject! do |candidate|
            [candidate, File.realpath(candidate)].any? do |label|
              File.basename(label).downcase.match?(/beta|release[ _-]?candidate|(?:^|[_. -])rc(?:$|[_. -])/)
            end
          end

          def version_components(candidate)
            version = File.basename(candidate)[/Xcode[_-](\d+(?:[._]\d+)*)/, 1]
            version.to_s.tr("_", ".").split(".").map(&:to_i)
          end

          selected = candidates.max_by { |candidate| version_components(candidate) }
          abort("No stable Xcode #{major} installation found") unless selected

          File.open(ENV.fetch("GITHUB_ENV"), "a") do |environment|
            environment.puts "DEVELOPER_DIR=#{selected}/Contents/Developer"
          end
          puts "Resolved Xcode: #{selected}"
          RUBY

      - name: Resolve iOS Simulator
        run: |
          ruby <<'RUBY'
          require "json"

          requested_device = ENV.fetch("SIMULATOR_DEVICE")
          runtimes = JSON.parse(`xcrun simctl list devices available --json`).fetch("devices")
          candidates = runtimes.flat_map do |runtime, devices|
            match = runtime.match(/SimRuntime\.iOS-(\d+(?:-\d+)*)$/)
            next [] unless match

            version = match[1].tr("-", ".")
            devices.filter_map do |device|
              next unless device.fetch("isAvailable", true)
              next unless device.fetch("name") == requested_device

              [version.split(".").map(&:to_i), version, device.fetch("udid")]
            end
          end

          selected = candidates.max_by(&:first)
          abort("No available #{requested_device} simulator found") unless selected

          _, version, udid = selected
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |environment|
            environment.puts "DESTINATION=platform=iOS Simulator,id=#{udid}"
          end
          puts "Resolved simulator: #{requested_device} iOS #{version} (#{udid})"
          RUBY

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "Destination: ${DESTINATION}"

      - name: Run package tests
        run: |
          xcodebuild test \
            -scheme ScrollableTabBar \
            -destination "${DESTINATION}" \
            -parallel-testing-enabled NO \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Package"

      - name: Run external product contract
        working-directory: ContractTests
        run: |
          xcodebuild test \
            -scheme ScrollableTabBarProductContract-Package \
            -destination "${DESTINATION}" \
            -parallel-testing-enabled NO \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Contract"

      - name: Build DocC with warnings as errors
        run: |
          xcodebuild docbuild \
            -scheme ScrollableTabBar \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-DocC" \
            OTHER_DOCC_FLAGS='--warnings-as-errors' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run demo UI smoke test
        run: |
          xcodebuild test \
            -workspace ScrollableTabBar.xcworkspace \
            -scheme ScrollableTabBarDemo \
            -destination "${DESTINATION}" \
            -only-testing:ScrollableTabBarDemoUITests \
            -parallel-testing-enabled NO \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-DemoTests"

      - name: Build Release demo
        run: |
          xcodebuild build \
            -workspace ScrollableTabBar.xcworkspace \
            -scheme ScrollableTabBarDemo \
            -configuration Release \
            -destination "${DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-DemoRelease" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify private runtime names are absent from Release binary
        run: |
          products="${RUNNER_TEMP}/ScrollableTabBar-DemoRelease/Build/Products/Release-iphonesimulator"
          app_bundle="$(find "${products}" -type d -name 'ScrollableTabBarDemo.app' -print -quit)"
          if [ -z "${app_bundle}" ]; then
            echo "ScrollableTabBarDemo.app was not found in Release products" >&2
            exit 1
          fi

          executable_name="$(plutil -extract CFBundleExecutable raw "${app_bundle}/Info.plist")"
          executable="${app_bundle}/${executable_name}"
          if [ ! -f "${executable}" ]; then
            echo "Release executable was not found: ${executable}" >&2
            exit 1
          fi

          strings_file="${RUNNER_TEMP}/ScrollableTabBarDemo.strings"
          /usr/bin/strings -a "${executable}" > "${strings_file}"

          private_names=(
            '_UIFloatingTabBar'
            '_tabModel'
            'setTabModel:'
            'tabModel'
            'collectionView'
            'showsSidebarButton'
            '_currentPlatformMetrics'
            '_maximumContainerSizeForPagination'
            '_UIFloatingTabBarPlatformMetrics_Glass'
            '_UILiquidLensView'
          )

          failed=false
          for private_name in "${private_names[@]}"; do
            if LC_ALL=C grep -Fq -- "${private_name}" "${strings_file}"; then
              echo "Release executable contains a private runtime name: ${private_name}" >&2
              failed=true
            fi
          done

          if [ "${failed}" = true ]; then
            exit 1
          fi
