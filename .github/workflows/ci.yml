name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Xcode 27 Package, Contract, and Demo Tests
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DESTINATION: 'platform=iOS Simulator,arch=arm64,name=iPhone 17,OS=27.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "Destination: ${DESTINATION}"

      - name: Run external product contract
        working-directory: ContractTests
        run: |
          xcodebuild test \
            -scheme ScrollableTabBarProductContract-Package \
            -destination "${DESTINATION}" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Contract" \
            -resultBundlePath "${RUNNER_TEMP}/ScrollableTabBar-Contract.xcresult"

      - name: Run package and demo UI tests
        run: |
          xcodebuild test \
            -workspace ScrollableTabBar.xcworkspace \
            -scheme ScrollableTabBarCI \
            -testPlan ScrollableTabBarCI \
            -destination "${DESTINATION}" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -testLanguage en \
            -testRegion US \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Workspace" \
            -resultBundlePath "${RUNNER_TEMP}/ScrollableTabBar-Workspace.xcresult"

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ runner.temp }}/ScrollableTabBar-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Build Release demo
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild build \
            -workspace ScrollableTabBar.xcworkspace \
            -scheme ScrollableTabBarDemo \
            -configuration Release \
            -destination "${DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Workspace" \
            CODE_SIGNING_ALLOWED=NO
