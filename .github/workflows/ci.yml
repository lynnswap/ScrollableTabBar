name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Xcode 27 Package, Contract, and Demo Tests
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DESTINATION: 'platform=iOS Simulator,arch=arm64,name=iPhone 17,OS=27.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "Destination: ${DESTINATION}"

      - name: Test Simulator helper
        run: python3 -m unittest discover -s .github/scripts -p 'test_simulator.py'

      - name: Start the test Simulator
        run: python3 .github/scripts/simulator.py prepare

      - name: Build package, product contract, and demo UI tests
        run: |
          xcodebuild build-for-testing \
            -workspace ScrollableTabBar.xcworkspace \
            -scheme ScrollableTabBarCI \
            -destination "${DESTINATION}" \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -testLanguage en \
            -testRegion US \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Workspace"

      - name: Wait for the test Simulator
        run: python3 .github/scripts/simulator.py wait

      - name: Run prepared tests
        run: |
          products="${RUNNER_TEMP}/ScrollableTabBar-Workspace/Build/Products"
          manifests=("${products}"/*.xctestrun)
          test "${#manifests[@]}" -eq 1
          xcodebuild test-without-building \
            -xctestrun "${manifests[0]}" \
            -destination "${DESTINATION}" \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath "${RUNNER_TEMP}/ScrollableTabBar-Workspace.xcresult"

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ runner.temp }}/ScrollableTabBar-Workspace.xcresult
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Build Release demo
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild build \
            -workspace ScrollableTabBar.xcworkspace \
            -scheme ScrollableTabBarDemo \
            -configuration Release \
            -destination "${DESTINATION}" \
            -derivedDataPath "${RUNNER_TEMP}/ScrollableTabBar-Workspace" \
            CODE_SIGNING_ALLOWED=NO

      - name: Clean up the test Simulator
        if: always()
        run: python3 .github/scripts/simulator.py cleanup
